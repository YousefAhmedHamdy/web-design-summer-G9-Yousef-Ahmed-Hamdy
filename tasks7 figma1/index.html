<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Layout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="cards-wrapper">
    
   
    <div class="card card-dark">
      <div class="front-content">
        <h3>Financial Sector<br>Development<br>Program</h3>
        <button class="icon-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
      </div>
    </div>

  
    <div class="card card-white">
      <div class="back-icon">
        <i class="fa-regular fa-map"></i>
      </div>
      <div class="back-content">
        <h3>Financial Sector<br>Development<br>Program</h3>
        <p>The Program aims to develop a diversified and effective financial sector to support the development of the Saudi Arabian economy.</p>
      </div>
      <div class="back-footer">
        <span>Read More</span>
        <button class="arrow-btn"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
    </div>

  </div>

</body>
</html>
